[project]
name = "cas-portfolio"
version = "0.1.0"
description = "Self-hosted portfolio dashboard built from Indian CAS statements (NSDL/CDSL, CAMS/KFintech)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "casparser>=1.4",
]

[project.urls]
Repository = "https://github.com/prsurve/cas-portfolio"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal"]
