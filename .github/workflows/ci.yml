name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock pytest httpx pytest-cov ruff pip-audit
      - name: Stylesheet is up to date
        run: scripts/build_css.sh --check
      - name: Privacy check
        run: python scripts/privacy_check.py
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Dependency audit
        run: .venv/bin/pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Tests (with coverage)
        run: PYTHONPATH=src CI=true .venv/bin/pytest -q --cov=portfolio --cov-report=term-missing:skip-covered --cov-fail-under=94
      - name: Page helper tests
        run: node tests/tools.test.js
