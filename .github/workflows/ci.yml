name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock pytest httpx
      - name: Stylesheet is up to date
        run: scripts/build_css.sh --check
      - name: Privacy check
        run: python scripts/privacy_check.py
      - name: Tests
        run: PYTHONPATH=src .venv/bin/pytest -q
